<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRON_OS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="TopBar">
      <p>IronMan OS</p>
      <p id="Current_Time"></p>
    </div>
    <div class="StartIcons">
        <img src="../assets/5579832.png" alt="Welcome_Icon" class="desktop-icon" id="WelcomeOpen">
        <img src="../assets/iron-man-removebg-preview.png" alt="IronBook" class="desktop-icon" id="OpenA1">
        <img src="../assets/IronCalc.png" alt="IronCalc" class="desktop-icon" id="CalcOpen" style="border-radius: 1rem;">
        <img src="../assets/Jarv_Termi.png" alt="Jarv_Termi" class="desktop-icon" id="Jarvis_Open" style="border-radius: 1rem;">
    </div>

    <div class="window Window1" id="WelcomeWindow" style="display: none;">
      <h1>Hi, and Welcome!</h1>
      <p>
        I am Tanmay Hathile! A 13 year old whose <br />
        mind constantly finds new ways to find desprission.
      </p>
      <p id="closeWindow">Close</p>
    </div>
     

    <div class="window Window2" id="IronPad" style="display: none;">
      <header class="window-header" id="IronPadheader">
        <h1>IronBook</h1>
        <button class="close-btn" id="closeIronPad">×</button>
      </header>
      <div class="ironbook-layout">
        <aside class="sidebar">
          <h3>Notes</h3>
          <ul id="notesList"></ul>
          <button id="newNoteBtn">+ New Note</button>
        </aside>
        <main class="editor-area">
          <input type="text" id="noteTitle" placeholder="Untitled" />
          <textarea id="noteContent" placeholder="Start writing..."></textarea>
          <div class="editor-actions">
            <button id="saveNoteBtn">Save</button>
            <button id="saveAsNoteBtn">Save As...</button>
            <button id="deleteNoteBtn">Delete</button>
          </div>
        </main>
      </div>
    </div>

    <div class="window Calculator" id="IronCalc" style="display: none;">
      <header class="window-header">
        <h1>IronCalc</h1>
        <button class="close-btn" id="closeIronCalc">×</button>
      </header>
      <div class="calc-layout">
        <div class="calc-display">
          <div class="calc-expression" id="calcExpr"></div>
          <div class="calc-result" id="calcResult">0</div>
        </div>
        <div class="calc-keypad" id="calcKeypad"></div>
      </div>
    </div>

    <div class="window Javis_Termi" id="Javis_Termi" style="display: none;">
      <header class="window-header" id="Javis_Termiheader">
        <h1>Javis_Termi</h1>
        <button class="close-btn" id="closeJavis_Termi">×</button>
      </header>
      <div class="terminal-body">
        <div class="terminal-output" id="terminalOutput">
          <p class="system-welcome">JARVIS_OS Secure Terminal v1.0.0</p>
          <p class="system-welcome">Type <span class="terminal-highlight">'help'</span> for a list of available commands.</p>
        </div>
        <div class="terminal-input-line">
          <span class="terminal-prompt">iron@jarvis:~$</span>
          <input type="text" id="terminalInput" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>

  </body>
  <script src="./script.js"></script>
</html>
